targets:
  $default:
    builders:
      freezed:
        generate_for:
          - lib/**/models/**.dart
          - lib/**/cubit/**.dart
      json_serializable:
        generate_for:
          - lib/**/models/**.dart
        options:
          explicit_to_json: true
      auto_route_generator:auto_route_generator:
        generate_for:
          - lib/**/view/pages/**.dart
      auto_route_generator:auto_router_generator:
        generate_for:
          - lib/core/router/app_router.dart
